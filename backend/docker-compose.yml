services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: olmeware
      POSTGRES_USER: olmeware
      POSTGRES_PASSWORD: olmeware
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - olmeware_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olmeware -d olmeware"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  olmeware_postgres_data:
